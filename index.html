    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f6f3;
            color: #1a2e22;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            background: linear-gradient(135deg, #00351f, #00693e);
            color: white;
            padding: 28px 40px;
            box-shadow: 0 4px 12px rgba(0, 53, 31, 0.18);
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            opacity: 0.85;
            font-size: 15px;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 25px;
        }

        /* =========================
           INDICADORES
        ========================= */

        .indicadores {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .indicador {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 12px rgba(0, 53, 31, 0.05);
            border: 1px solid #d4e2d9;
        }

        .indicador .titulo {
            color: #5f7567;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .indicador .valor {
            font-size: 32px;
            font-weight: bold;
            color: #00351f;
        }

        /* =========================
           BARRA DE FERRAMENTAS
        ========================= */

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .busca {
            flex: 1;
            max-width: 450px;
        }

        .busca input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d4e2d9;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background: #ffffff;
        }

        .busca input:focus {
            border-color: #00693e;
            box-shadow: 0 0 0 3px rgba(0, 105, 62, 0.15);
        }

        .acoes {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 14px;
            background: #00693e;
            color: white;
            font-weight: 500;
            transition: background 0.2s;
        }

        button:hover {
            background: #00351f;
        }

        /* =========================
           ÁREA DO ORGANOGRAMA
        ========================= */

        .organograma-container {
            background: white;
            border-radius: 15px;
            padding: 40px 20px;
            min-height: 550px;
            overflow-x: auto;
            box-shadow: 0 3px 15px rgba(0, 53, 31, 0.06);
            border: 1px solid #d4e2d9;
            text-align: center;
        }

        .organograma {
            display: inline-flex;
            justify-content: center;
            min-width: 100%;
            padding: 10px 20px;
        }

        /* =========================
           ÁRVORE HIERÁRQUICA
        ========================= */

        .tree {
            display: inline-flex;
            justify-content: center;
            margin: 0 auto;
            padding: 0;
        }

        .tree, .tree ul {
            position: relative;
            display: flex;
            justify-content: center;
            padding-left: 0;
            margin-top: 0;
            margin-bottom: 0;
        }

        .tree ul {
            padding-top: 25px;
            gap: 25px;
        }

        .tree li {
            list-style: none;
            text-align: center;
            position: relative;
            padding: 25px 8px 0 8px;
        }

        /* Linha vertical superior para nós comuns */
        .tree li::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 25px;
            background: #8fbf9f;
        }

        /* Remove a linha vertical no topo do nó Raiz (CAMPUS CHAPECÓ) */
        .tree > li {
            padding-top: 0;
        }
        .tree > li::before {
            display: none;
        }

        /* Linha horizontal entre irmãos */
        .tree li:not(:only-child)::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: #8fbf9f;
        }

        .tree li:first-child::after {
            left: 50%;
        }

        .tree li:last-child::after {
            right: 50%;
        }

        .tree li:only-child::after {
            display: none;
        }

        /* =========================
           CARTÕES DAS UNIDADES
        ========================= */

        .unidade {
            width: 230px;
            background: white;
            border: 1px solid #d4e2d9;
            border-top: 5px solid #00693e;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(0, 53, 31, 0.07);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 2;
            margin: 0 auto;
        }

        .unidade:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(0, 53, 31, 0.15);
            border-color: #00693e;
        }

        /* Estilo Exclusivo do Nó Principal (CAMPUS CHAPECÓ) */
        .unidade.principal {
            width: 300px;
            background: linear-gradient(135deg, #00351f, #00693e);
            color: white;
            border: 2px solid #002213;
            border-top: 6px solid #fbbf24;
            box-shadow: 0 8px 20px rgba(0, 53, 31, 0.3);
            padding: 20px 18px;
        }

        .unidade.principal:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 28px rgba(0, 53, 31, 0.4);
        }

        .sigla-unidade {
            font-size: 11px;
            font-weight: 700;
            color: #00693e;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.6px;
        }

        .principal .sigla-unidade {
            color: #fef08a;
            font-size: 12px;
        }

        .nome-unidade {
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 12px;
            line-height: 1.35;
            word-wrap: break-word;
        }

        .principal .nome-unidade {
            font-size: 17px;
            margin-bottom: 14px;
        }

        .colaboradores {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 22px;
            font-weight: 800;
            color: #00693e;
        }

        .principal .colaboradores {
            color: #ffffff;
            font-size: 26px;
        }

        .legenda {
            font-size: 11px;
            color: #5f7567;
            margin-top: 3px;
        }

        .principal .legenda {
            color: #d1fae5;
        }

        .expandir-btn {
            position: absolute;
            right: 8px;
            top: 8px;
            font-size: 12px;
            color: #5f7567;
            padding: 4px 7px;
            border-radius: 4px;
            user-select: none;
            transition: background 0.2s;
        }

        .expandir-btn:hover {
            background: #eaf5ef;
        }

        .principal .expandir-btn {
            color: white;
        }

        .principal .expandir-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .encontrado .unidade {
            border-color: #f59e0b;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.3);
        }

        /* =========================
           MODAL / POP-UP
        ========================= */

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 35, 20, 0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 14px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 53, 31, 0.25);
            animation: modalEntrada 0.2s ease-out;
        }

        @keyframes modalEntrada {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #d4e2d9;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background: #f3f9f5;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 18px;
            color: #00351f;
        }

        .modal-header .subtitulo {
            font-size: 13px;
            color: #5f7567;
            margin-top: 4px;
        }

        .modal-close {
            background: transparent;
            color: #5f7567;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 0 6px;
            border-radius: 6px;
        }

        .modal-close:hover {
            color: #00351f;
            background: #d4e2d9;
        }

        .modal-body {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
        }

        .lista-servidores {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item-servidor {
            padding: 10px 14px;
            border-bottom: 1px solid #edf4ef;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #1a2e22;
        }

        .item-servidor:last-child {
            border-bottom: none;
        }

        .item-servidor:hover {
            background: #f3f8f5;
        }

        .icone-servidor {
            color: #00693e;
            font-size: 16px;
        }

        .vazio-msg {
            text-align: center;
            color: #5f7567;
            padding: 30px 0;
            font-style: italic;
        }

        /* =========================
           RODAPÉ
        ========================= */

        .rodape {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            padding: 25px;
        }

        @media (max-width: 800px) {
            header { padding: 22px; }
            header h1 { font-size: 23px; }
            .container { padding: 15px; }
            .indicadores { grid-template-columns: 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .busca { max-width: none; }
        }
    </style>
</head>

<script>
/*
=====================================================
ESTRUTURA DE DADOS E VARIÁVEIS GLOBAIS
=====================================================
*/
let dadosOrganograma = null;
let contadorIds = 0;

/*
=====================================================
INICIALIZAÇÃO AUTOMÁTICA
=====================================================
*/
window.addEventListener("DOMContentLoaded", () => {
    // Tenta carregar o ficheiro remoto caso esteja rodando num servidor web
    fetch("servidores_full.csv")
        .then(response => {
            if (!response.ok) throw new Error("Usando dados embutidos.");
            return response.text();
        })
        .then(csvTexto => {
            parsearCSV(csvTexto);
        })
        .catch(() => {
            // Se aberto diretamente do computador (file://), lê da tag embutida automaticamente
            const csvEmbutido = document.getElementById("dadosCsvEmbutidos").textContent;
            parsearCSV(csvEmbutido);
        });
});

/*
=====================================================
PARSE E CONSTRUÇÃO HIERÁRQUICA DO CSV
=====================================================
*/
function parsearCSV(csvConteudo) {
    Papa.parse(csvConteudo.trim(), {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: true,
        complete: function(results) {
            if (results.data && results.data.length > 0) {
                processarRegistos(results.data);
            }
        }
    });
}

function processarRegistos(rows) {
    const nodesMap = {};

    rows.forEach(row => {
        const getVal = (possibleKeys) => {
            for (let key of Object.keys(row)) {
                if (possibleKeys.includes(key.trim().toLowerCase())) {
                    return row[key] !== undefined && row[key] !== null ? String(row[key]).trim() : '';
                }
            }
            return '';
        };

        const servidor = getVal(['nome_ascii', 'nome', 'servidor', 'funcionario']);
        const u_id = getVal(['id_unidade', 'idunidade']);
        const u_sigla = getVal(['sigla_unidade', 'siglaunidade', 'sigla']);
        const u_nome = getVal(['unidade', 'nome_unidade']);

        const p_id = getVal(['id_unidade_responsavel', 'idunidaderesponsavel', 'id_pai']);
        const p_sigla = getVal(['sigla_unidade_responsavel', 'siglaunidaderesponsavel', 'sigla_pai']);
        const p_nome = getVal(['unidade_responsavel', 'unidaderesponsavel', 'nome_pai']);

        if (!u_id && !p_id) return;

        // Cria/atualiza o nó Pai
        if (p_id) {
            if (!nodesMap[p_id]) {
                nodesMap[p_id] = {
                    id: p_id,
                    sigla: p_sigla || p_id,
                    nome: p_nome || p_id,
                    id_responsavel: null,
                    servidores: [],
                    filhos: []
                };
            } else {
                if (p_sigla && !nodesMap[p_id].sigla) nodesMap[p_id].sigla = p_sigla;
                if (p_nome && !nodesMap[p_id].nome) nodesMap[p_id].nome = p_nome;
            }
        }

        // Cria/atualiza o nó Atual
        if (u_id) {
            if (!nodesMap[u_id]) {
                nodesMap[u_id] = {
                    id: u_id,
                    sigla: u_sigla || u_id,
                    nome: u_nome || u_id,
                    id_responsavel: p_id || null,
                    servidores: [],
                    filhos: []
                };
            } else {
                if (p_id) nodesMap[u_id].id_responsavel = p_id;
                if (u_sigla) nodesMap[u_id].sigla = u_sigla;
                if (u_nome) nodesMap[u_id].nome = u_nome;
            }

            if (servidor) {
                nodesMap[u_id].servidores.push(servidor);
            }
        }
    });

    // Encadeia os nós
    const roots = [];
    Object.keys(nodesMap).forEach(id => {
        const node = nodesMap[id];
        const p_id = node.id_responsavel;

        if (p_id && nodesMap[p_id] && p_id !== id) {
            nodesMap[p_id].filhos.push(node);
        } else {
            roots.push(node);
        }
    });

    dadosOrganograma = (roots.length === 1) ? roots[0] : {
        id: 'root',
        sigla: 'GERAL',
        nome: 'Organização',
        id_responsavel: null,
        servidores: [],
        filhos: roots
    };

    renderizar();
    calcularIndicadores();
    centralizarOrganograma();
}

/*
=====================================================
RENDERIZAÇÃO E CENTRALIZAÇÃO DO ORGANOGRAMA
=====================================================
*/
function criarUnidadeElemento(unidade, nivel = 0) {
    const li = document.createElement("li");
    li.dataset.nome = (unidade.nome + " " + unidade.sigla).toLowerCase();
    li.dataset.servidores = (unidade.servidores || []).join(" ").toLowerCase();

    const card = document.createElement("div");
    card.className = "unidade";
    if (nivel === 0) {
        card.classList.add("principal");
    }

    const id = "unidade-" + contadorIds++;
    card.dataset.id = id;

    const temFilhos = unidade.filhos && unidade.filhos.length > 0;
    const simboloExpandir = temFilhos ? `<span class="expandir-btn">▼</span>` : "";

    const totalServidores = unidade.servidores ? unidade.servidores.length : 0;

    card.innerHTML = `
        ${simboloExpandir}
        <div class="sigla-unidade">${unidade.sigla}</div>
        <div class="nome-unidade">${unidade.nome}</div>
        <div class="colaboradores">👥 ${totalServidores}</div>
        <div class="legenda">servidores lotados</div>
    `;

    card.addEventListener("click", function(event) {
        if (event.target.classList.contains("expandir-btn")) {
            event.stopPropagation();
            const ul = li.querySelector(":scope > ul");
            if (ul) {
                const aberto = ul.style.display !== "none";
                ul.style.display = aberto ? "none" : "flex";
                event.target.textContent = aberto ? "▶" : "▼";
                centralizarOrganograma();
            }
            return;
        }

        abrirModalServidores(unidade);
    });

    li.appendChild(card);

    if (temFilhos) {
        const ul = document.createElement("ul");
        unidade.filhos.forEach(filho => {
            const filhoElemento = criarUnidadeElemento(filho, nivel + 1);
            ul.appendChild(filhoElemento);
        });
        li.appendChild(ul);
    }

    return li;
}

function renderizar() {
    const container = document.getElementById("organograma");
    container.innerHTML = "";

    if (!dadosOrganograma) return;

    contadorIds = 0;
    const tree = document.createElement("ul");
    tree.className = "tree";

    tree.appendChild(criarUnidadeElemento(dadosOrganograma));
    container.appendChild(tree);
}

function centralizarOrganograma() {
    setTimeout(() => {
        const container = document.querySelector('.organograma-container');
        if (container) {
            container.scrollLeft = (container.scrollWidth - container.clientWidth) / 2;
        }
    }, 100);
}

/*
=====================================================
POP-UP / MODAL DE SERVIDORES
=====================================================
*/
function abrirModalServidores(unidade) {
    const modal = document.getElementById("modalServidores");
    const titulo = document.getElementById("modalNomeUnidade");
    const subtitulo = document.getElementById("modalSubtitulo");
    const conteudo = document.getElementById("modalConteudo");

    titulo.textContent = `[${unidade.sigla}] ${unidade.nome}`;
    
    const servidores = unidade.servidores || [];
    subtitulo.textContent = `Total: ${servidores.length} servidor(es) diretamente lotado(s)`;

    if (servidores.length === 0) {
        conteudo.innerHTML = `<div class="vazio-msg">Nenhum servidor diretamente lotado nesta unidade.</div>`;
    } else {
        let htmlLista = `<ul class="lista-servidores">`;
        servidores.forEach(s => {
            htmlLista += `
                <li class="item-servidor">
                    <span class="icone-servidor">👤</span>
                    <span><strong>${escapeHtml(s)}</strong></span>
                </li>
            `;
        });
        htmlLista += `</ul>`;
        conteudo.innerHTML = htmlLista;
    }

    modal.classList.add("ativo");
}

function fecharModal() {
    document.getElementById("modalServidores").classList.remove("ativo");
}

window.addEventListener("click", function(e) {
    const modal = document.getElementById("modalServidores");
    if (e.target === modal) {
        fecharModal();
    }
});

window.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        fecharModal();
    }
});

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

/*
=====================================================
INDICADORES
=====================================================
*/
function obterTodasUnidades(unidade) {
    let resultado = [unidade];
    if (unidade.filhos) {
        unidade.filhos.forEach(filho => {
            resultado = resultado.concat(obterTodasUnidades(filho));
        });
    }
    return resultado;
}

function calcularIndicadores() {
    if (!dadosOrganograma) return;

    const unidades = obterTodasUnidades(dadosOrganograma);

    document.getElementById("totalUnidades").textContent = unidades.length;

    const totalServidores = unidades.reduce((soma, u) => soma + (u.servidores ? u.servidores.length : 0), 0);
    document.getElementById("totalColaboradores").textContent = totalServidores;

    document.getElementById("totalDepartamentos").textContent = dadosOrganograma.filhos ? dadosOrganograma.filhos.length : 0;
}

/*
=====================================================
EXPANDIR, RECOLHER E PESQUISAR
=====================================================
*/
function expandirTodos() {
    document.querySelectorAll(".tree ul").forEach(ul => ul.style.display = "flex");
    document.querySelectorAll(".expandir-btn").forEach(btn => btn.textContent = "▼");
    centralizarOrganograma();
}

function recolherTodos() {
    document.querySelectorAll(".tree li ul").forEach(ul => ul.style.display = "none");
    document.querySelectorAll(".expandir-btn").forEach(btn => btn.textContent = "▶");
    centralizarOrganograma();
}

document.getElementById("campoBusca").addEventListener("input", function() {
    const termo = this.value.toLowerCase().trim();
    const itens = document.querySelectorAll(".tree li");

    itens.forEach(item => item.classList.remove("encontrado"));

    if (!termo) return;

    itens.forEach(item => {
        const nome = item.dataset.nome || "";
        const servidores = item.dataset.servidores || "";

        if (nome.includes(termo) || servidores.includes(termo)) {
            item.classList.add("encontrado");

            let pai = item.parentElement?.closest("li");
            while (pai) {
                const ul = pai.querySelector(":scope > ul");
                if (ul) ul.style.display = "flex";
                pai = pai.parentElement?.closest("li");
            }
        }
    });
});
</script>
